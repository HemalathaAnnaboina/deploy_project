<!DOCTYPE html>
<html>
<head>
    <title>Deployment Successful</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f2027;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            width: 70%;
            max-width: 800px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
            color: #00ffcc;
        }

        p {
            font-size: 20px;
            margin: 10px 0;
        }

        .pipeline {
            margin-top: 30px;
            font-size: 22px;
            letter-spacing: 2px;
            color: #ffd700;
        }

        .status {
            margin-top: 30px;
            font-size: 26px;
            font-weight: bold;
            color: #00ff00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rocket {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="rocket">🚀</div>
        <h1>Congratulations Seema!</h1>
        <p>You have successfully deployed your project using:</p>

        <div class="pipeline">
            Jenkins ➜ Maven ➜ Tomcat
        </div>

        <p>CI/CD Pipeline executed successfully.</p>

        <div class="status">
            BUILD SUCCESS | DEPLOYMENT SUCCESS ✅
        </div>
    </div>

</body>
</html>
