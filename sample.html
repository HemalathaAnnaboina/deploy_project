<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Deployment Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            width: 60%;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00ffcc;
        }

        .steps {
            text-align: left;
            margin-top: 30px;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>🚀 Successfully Deployed!</h1>
        <h2>CI/CD Pipeline Working Perfectly</h2>

        <div class="steps">
            <p>✔ Code pushed to GitHub</p>
            <p>✔ Jenkins triggered automatically</p>
            <p>✔ Maven build completed</p>
            <p>✔ WAR deployed to Tomcat</p>
        </div>

        <footer>
            Deployed using GitHub → Maven → Jenkins → Tomcat
        </footer>
    </div>

</body>
</html>
